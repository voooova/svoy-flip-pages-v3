<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><title>Театр «Свои» — hover-flip v3</title>
<style>
:root {{
  --bg: #14110d;
  --gold: #cbb87a;
  --muted: #7c715a;
  --paper: #efe7d8;
}}
* {{ box-sizing: border-box; }}
body {{ margin:0; padding:40px 24px; background:var(--bg); font-family:-apple-system, system-ui, sans-serif; color:#e8e2d2; }}
h1 {{ text-align:center; color:var(--gold); font-weight:300; letter-spacing:0.08em; margin:0 0 8px; font-size:22px; }}
.subtitle {{ text-align:center; color:var(--muted); margin:0 0 40px; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; }}
.row {{ display:flex; gap:32px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }}
.card {{ display:flex; flex-direction:column; align-items:center; width:340px; margin-bottom:24px; }}
.label {{ color:var(--gold); font-size:11px; letter-spacing:0.22em; text-transform:uppercase; margin-bottom:10px; }}
.scene {{
  width: 340px; height: 425px;
  perspective: 1600px; perspective-origin: 50% 50%;
  background: var(--paper);
  padding: 14px; border-radius: 4px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55);
}}
.card.landscape .scene {{ height: 340px; }}
.card.square .scene {{ height: 340px; }}
.card.portrait .scene {{ height: 425px; }}
.frame {{
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform 1s cubic-bezier(.2,.8,.2,1);
  cursor: pointer;
}}
.scene:hover .frame {{ transform: rotateY(180deg); }}
.face {{
  position: absolute; inset: 0;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}}
.front {{ z-index: 2; }}
.back  {{ transform: rotateY(180deg); }}
.side {{
  width: 22px;
  left: auto; right: -11px; top: 0; bottom: 0;
  transform: rotateY(90deg);
  transform-origin: 0 50%;
  box-shadow: inset -2px 0 4px rgba(0,0,0,0.4);
}}
.hint {{ color:var(--muted); text-align:center; margin-top:14px; font-size:11px; letter-spacing:0.06em; line-height:1.5; }}
</style></head><body>
<h1>Спектакли театра «Свои»</h1>
<p class="subtitle">hover на раме — переворот</p>
<div class="row">
<div class="card landscape">
  <div class="label">Бунин в Москве</div>
  <div class="scene"><div class="frame">
    <div class="face front" style="background-image:url('bunin-front.png')"></div>
    <div class="face side" style="background-image:url('bunin-side.png')"></div>
    <div class="face back" style="background-image:url('bunin-back.png')"></div>
  </div></div>
  <div class="hint">постановка Кирилла Пирогова</div>
</div>

<div class="card portrait">
  <div class="label">Женитьба Фигаро</div>
  <div class="scene"><div class="frame">
    <div class="face front" style="background-image:url('figaro-front.png')"></div>
    <div class="face side" style="background-image:url('figaro-side.png')"></div>
    <div class="face back" style="background-image:url('figaro-back.png')"></div>
  </div></div>
  <div class="hint">постановка Кирилла Пирогова</div>
</div>

<div class="card portrait">
  <div class="label">В ожидании Годо</div>
  <div class="scene"><div class="frame">
    <div class="face front" style="background-image:url('godo-front.png')"></div>
    <div class="face side" style="background-image:url('godo-side.png')"></div>
    <div class="face back" style="background-image:url('godo-back.png')"></div>
  </div></div>
  <div class="hint">постановка курс Кирилла Пирогова</div>
</div>

<div class="card portrait">
  <div class="label">Ревизор</div>
  <div class="scene"><div class="frame">
    <div class="face front" style="background-image:url('revizor-front.png')"></div>
    <div class="face side" style="background-image:url('revizor-side.png')"></div>
    <div class="face back" style="background-image:url('revizor-back.png')"></div>
  </div></div>
  <div class="hint">постановка Алексея Игнашина</div>
</div>

<div class="card square">
  <div class="label">Старшая сестра</div>
  <div class="scene"><div class="frame">
    <div class="face front" style="background-image:url('sestra-front.png')"></div>
    <div class="face side" style="background-image:url('sestra-side.png')"></div>
    <div class="face back" style="background-image:url('sestra-back.png')"></div>
  </div></div>
  <div class="hint">постановка Алексея Игнашина</div>
</div>
</div>
</body></html>
